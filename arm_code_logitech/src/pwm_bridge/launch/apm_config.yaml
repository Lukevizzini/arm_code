# Common configuration for APM2 autopilot
#
/**:
  ros__parameters:
    startup_px4_usb_quirk: false

/**/sys:
  ros__parameters:
    min_voltage: [10.0]
    disable_diag: false
    heartbeat_rate: 1.0
    heartbeat_mav_type: "ONBOARD_CONTROLLER"
    conn_timeout: 10.0

/**/time:
  ros__parameters:
    time_ref_source: "fcu"
    timesync_mode: MAVLINK
    timesync_avg_alpha: 0.6
    timesync_rate: 1.0
    system_time_rate: 1.0

/**/cmd:
  ros__parameters:
    use_comp_id_system_control: false

/**/global_position:
  ros__parameters:
    frame_id: "map"
    child_frame_id: "base_link"
    rot_covariance: 99999.0
    gps_uere: 1.0
    use_relative_alt: true
    tf.send: false
    tf.frame_id: "map"
    tf.global_frame_id: "earth"
    tf.child_frame_id: "base_link"

/**/imu:
  ros__parameters:
    frame_id: "base_link"
    linear_acceleration_stdev: 0.0003
    angular_velocity_stdev: 0.0003490659
    orientation_stdev: 1.0
    magnetic_stdev: 0.0

/**/local_position:
  ros__parameters:
    frame_id: "map"
    tf.send: false
    tf.frame_id: "map"
    tf.child_frame_id: "base_link"
    tf.send_fcu: false

/**/setpoint_accel:
  ros__parameters:
    send_force: false

/**/setpoint_attitude:
  ros__parameters:
    reverse_thrust: false
    use_quaternion: false
    tf.listen: false
    tf.frame_id: "map"
    tf.child_frame_id: "target_attitude"
    tf.rate_limit: 50.0

/**/setpoint_raw:
  ros__parameters:
    thrust_scaling: 1.0

/**/setpoint_position:
  ros__parameters:
    tf.listen: false
    tf.frame_id: "map"
    tf.child_frame_id: "target_position"
    tf.rate_limit: 50.0
    mav_frame: LOCAL_NED

/**/guided_target:
  ros__parameters:
    tf.listen: false
    tf.frame_id: "map"
    tf.child_frame_id: "target_position"
    tf.rate_limit: 50.0

/**/setpoint_velocity:
  ros__parameters:
    mav_frame: LOCAL_NED

/**/mission:
  ros__parameters:
    pull_after_gcs: true
    use_mission_item_int: true

/**/distance_sensor:
  ros__parameters:
    config: |
      rangefinder_pub:
        id: 0
        frame_id: "lidar"
        field_of_view: 0.0
        send_tf: false
        sensor_position: {x:  0.0, y:  0.0, z:  -0.1}
      rangefinder_sub:
        subscriber: true
        id: 1
        orientation: PITCH_270

/**/image:
  ros__parameters:
    frame_id: "px4flow"

/**/fake_gps:
  ros__parameters:
    use_mocap: true
    mocap_transform: false
    mocap_withcovariance: false
    use_vision: false
    use_hil_gps: true
    gps_id: 4
    geo_origin.lat: 47.3667
    geo_origin.lon: 8.5500
    geo_origin.alt: 408.0
    eph: 2.0
    epv: 2.0
    horiz_accuracy: 0.5
    vert_accuracy: 0.5
    speed_accuracy: 0.0
    satellites_visible: 6
    fix_type: 3
    tf.listen: false
    tf.send: false
    tf.frame_id: "map"
    tf.child_frame_id: "fix"
    tf.rate_limit: 10.0
    gps_rate: 5.0

/**/landing_target:
  ros__parameters:
    listen_lt: false
    mav_frame: "LOCAL_NED"
    land_target_type: "VISION_FIDUCIAL"
    image.width: 640
    image.height: 480
    camera.fov_x: 2.0071286398
    camera.fov_y: 2.0071286398
    tf.send: true
    tf.listen: false
    tf.frame_id: "landing_target"
    tf.child_frame_id: "camera_center"
    tf.rate_limit: 10.0
    target_size: {x: 0.3, y: 0.3}

/**/mocap:
  ros__parameters:
    use_tf: false
    use_pose: true

/**/mount:
  ros__parameters:
    debounce_s: 4.0
    err_threshold_deg: 10.0
    negate_measured_roll: false
    negate_measured_pitch: false
    negate_measured_yaw: false

/**/odometry:
  ros__parameters:
    fcu.odom_parent_id_des: "map"
    fcu.odom_child_id_des: "map"

/**/px4flow:
  ros__parameters:
    frame_id: "px4flow"
    ranger_fov: 0.118682
    ranger_min_range: 0.3
    ranger_max_range: 5.0

/**/vision_pose:
  ros__parameters:
    tf.listen: false
    tf.frame_id: "map"
    tf.child_frame_id: "vision_estimate"
    tf.rate_limit: 10.0

/**/vision_speed:
  ros__parameters:
    listen_twist: true
    twist_cov: true
