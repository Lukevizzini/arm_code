use_gazebo: false

## Input command properties
# "unitless" = values in [-1, 1] range (scaled by scale.linear/rotational)
# "speed_units" = values in m/s and rad/s
command_in_type: "speed_units"

scale:
  linear: 1.4 #0.7 #0.35
  rotational: 4.8 #2.4 #1.2
  joint: 4.0 #2.0 #1.0

## Output command properties
publish_period: 0.034
low_latency_mode: false
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

## Smoothing
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

## Planning scene: set false because move_group owns the primary scene
is_primary_planning_scene_monitor: false

## MoveIt properties
move_group_name: arm
planning_frame: base_link
ee_frame_name: tool0
robot_link_command_frame: base_link

## Topic names
cartesian_command_in_topic: /servo_server/delta_twist_cmds
joint_command_in_topic: /servo_server/delta_joint_cmds
joint_topic: /joint_states
status_topic: /servo_server/status
command_out_topic: /arm_controller/joint_trajectory

## Timeout
incoming_command_timeout: 0.2
num_outgoing_halt_msgs_to_publish: 4

## Singularity / joint limits
lower_singularity_threshold: 12.0
hard_stop_singularity_threshold: 18.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margin: 0.1

## Collision checking
check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
